<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Stokit</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #211c18;
        background: #fbf7f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(520px, calc(100% - 40px));
        padding: 56px 0;
        text-align: center;
      }
      h1 {
        font-size: 42px;
        line-height: 1;
        margin: 0 0 16px;
      }
      p {
        font-size: 18px;
        line-height: 1.55;
        margin: 0 0 18px;
      }
      .code {
        display: inline-block;
        margin: 10px 0 22px;
        padding: 12px 18px;
        border: 1px solid #dfd4c7;
        border-radius: 14px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.08em;
        background: #fffaf2;
      }
      a {
        display: inline-block;
        color: #211c18;
        background: #c07038;
        border-radius: 14px;
        padding: 14px 18px;
        font-weight: 800;
        text-decoration: none;
      }
      .fallback {
        display: block;
        margin-top: 16px;
        color: #8b4f25;
        background: transparent;
        padding: 0;
      }
    </style>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = (params.get('code') || params.get('invite') || '').trim().toUpperCase();
      const deepLink = code ? `pantrypal://join?code=${encodeURIComponent(code)}` : 'pantrypal://join';
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelector('[data-code]').textContent = code || 'INVITE CODE';
        document.querySelector('[data-open]').setAttribute('href', deepLink);
        if (code) window.location.href = deepLink;
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Join Stokit</h1>
      <p>Open Stokit to join this household.</p>
      <div class="code" data-code>INVITE CODE</div>
      <p><a data-open href="pantrypal://join">Open in Stokit</a></p>
      <a class="fallback" href="https://testflight.apple.com/join/eJTwChas">Install Stokit with TestFlight</a>
    </main>
  </body>
</html>
